<meta charset="utf-8" />
<title>Moshe's Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4C6FA5" />
<meta name="robots" content="noindex, nofollow" />
<!-- Own mark: two overlapping workspace tiles (not ASP's 5-bar chart mark) -- one shape per
     company workspace under one desk. Used for both the favicon and the opener splash below. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'%3E%3Crect x='4' y='14' width='30' height='30' rx='8' fill='%237FA0D1' opacity='.6'/%3E%3Crect x='20' y='4' width='30' height='30' rx='8' fill='%234C6FA5'/%3E%3C/svg%3E" />
<!-- Shared design tokens live in the asp-bookings repo (single source of truth) -- see
     frontend/styles.css there and CLAUDE.md's "one static index.html" exception note. -->
<link rel="stylesheet" href="https://moshe-gif.github.io/asp-bookings/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- Same body shell workspaces/asp.js's render() expects (#opener, #app, #toasts) --
     structural markup duplication only, not logic; see the plan's decision #5a. The opener
     handler itself no-ops safely if #opener is absent (workspaces/asp.js:4510-4511), so this
     is free to carry this site's own branding instead of ASP's. -->
<div id="opener" aria-hidden="true">
  <div class="opener-mark" style="height:56px;width:50px;position:relative;">
    <svg width="50" height="50" viewBox="0 0 56 56" style="position:absolute;left:0;bottom:0;">
      <rect x="4" y="14" width="30" height="30" rx="8" fill="#7FA0D1" opacity=".6"/>
      <rect x="20" y="4" width="30" height="30" rx="8" fill="#4C6FA5"/>
    </svg>
  </div>
  <div class="opener-word">Moshe's Desk</div>
  <div class="opener-tag">Parent Ops</div>
  <div class="opener-skip">Tap to skip</div>
</div>

<div id="app"></div>
<!-- VOX mounts here when the switcher picks it; hidden by default, toggled by shell.js.
     Kept separate from #app so switching never touches ASP's own internal render cycle. -->
<div id="voxHost" style="display:none;"></div>
<div class="toast-wrap" id="toasts"></div>

<!-- Must run before asp.js's script tag below -- its login screen reads this at render time. -->
<script>window.ASP_BRAND_OVERRIDE = { name: "Moshe's Desk", tagline: 'ASP login' };</script>
<!-- Order matters: asp.js must load (and register window.supabaseClient) before shell.js runs,
     so shell.js can reuse that one client instance instead of creating a second one against the
     same Supabase project -- see shell.js's own comment on why that matters. -->
<script src="workspaces/vox.js"></script>
<script src="https://moshe-gif.github.io/asp-bookings/workspaces/asp.js"></script>
<script src="shell.js"></script>
